name: Proto drift check

on:
  pull_request:
    paths:
      - 'BTCPayServer.Plugins.LightningTerminal/Protos/**'
      - 'scripts/check-proto-drift.sh'
  schedule:
    # Weekly, so drift surfaces on its own rather than only when someone happens to touch Protos/.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-proto-drift.sh
